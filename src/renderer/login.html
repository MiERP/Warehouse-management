<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập — Warehouse Management</title>
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <!-- Theme Toggle (top-right) -->
  <button class="theme-toggle" id="theme-toggle" title="Chuyển đổi giao diện">
    <svg class="theme-icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="5"/>
      <line x1="12" y1="1" x2="12" y2="3"/>
      <line x1="12" y1="21" x2="12" y2="23"/>
      <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
      <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
      <line x1="1" y1="12" x2="3" y2="12"/>
      <line x1="21" y1="12" x2="23" y2="12"/>
      <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
      <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
    </svg>
    <svg class="theme-icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
    </svg>
  </button>

  <div class="login-bg">
    <div class="login-center">
      <div class="login-card">
        <div class="login-brand">
          <div class="brand-icon">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
              <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
          </div>
          <h1 class="brand-title">Hệ thống quản lý nhà kho thông minh</h1>
          <p class="brand-subtitle">Nhập thông tin để truy cập hệ thống</p>
        </div>

        <form id="login-form" class="login-form">
          <div class="form-group">
            <label class="form-label" for="unit-name">Tên đơn vị sử dụng</label>
            <input class="form-input" type="text" id="unit-name" placeholder="Nhập tên đơn vị" autocomplete="off">
          </div>

          <div class="form-group">
            <label class="form-label" for="user-name">Tên người sử dụng</label>
            <input class="form-input" type="text" id="user-name" placeholder="Nhập tên người dùng" autocomplete="off">
          </div>

          <div class="form-group">
            <label class="form-label" for="password">Mật khẩu</label>
            <input class="form-input" type="password" id="password" placeholder="Nhập mật khẩu" autocomplete="off">
          </div>

          <div id="login-error" class="login-error" style="display:none"></div>

          <button type="submit" class="login-btn" id="login-btn">Đăng nhập</button>

          <p class="login-hint">Mật khẩu mặc định là <code>123456</code></p>
        </form>
      </div>
    </div>
  </div>

  <div id="license-info" class="license-info" style="display:none"></div>

  <script src="js/web_api_adapter.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
